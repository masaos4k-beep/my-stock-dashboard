<script>

const periodSettings = [
    {
        cmin: -12.94225481209899,
        cmax: 12.94225481209899
    },
    {
        cmin: -23.410799494440017,
        cmax: 23.410799494440017
    },
    {
        cmin: -46.0591111308945,
        cmax: 46.0591111308945
    },
    {
        cmin: -98.55049581495564,
        cmax: 98.55049581495564
    }
];


function changePeriod(index) {

    const visible = [
        false, false,
        false, false,
        false, false,
        false, false
    ];

    visible[index * 2] = true;
    visible[index * 2 + 1] = true;

    const settings = periodSettings[index];

    Plotly.restyle(
        "global-map-chart",
        {
            visible: visible
        }
    );

    Plotly.restyle(
        "global-map-chart",
        {
            "marker.cmin": settings.cmin,
            "marker.cmax": settings.cmax
        },
        [0, 2, 4, 6]
    ).then(() => {

        // 表示対象のトレースに対応するカラーバーを更新
        Plotly.relayout(
            "global-map-chart",
            {
                "title": ""
            }
        );

    });

    document.querySelectorAll(".period-btn").forEach(
        (button, buttonIndex) => {

            button.classList.toggle(
                "active",
                buttonIndex === index
            );

        }
    );
}


document.querySelectorAll(".period-btn").forEach(
    button => {

        button.addEventListener("click", () => {

            changePeriod(
                Number(button.dataset.period)
            );

        });

    }
);


window.addEventListener("resize", () => {

    const chart = document.getElementById(
        "global-map-chart"
    );

    if (chart) {
        Plotly.Plots.resize(chart);
    }

});

</script>
