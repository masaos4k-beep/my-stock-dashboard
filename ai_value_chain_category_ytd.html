                },

                yanchor: 'middle'
            };

            const layout = {
                title: '<b>' + selectedCat + ' : 年初来（YTD）騰落率推移</b>',
                xaxis: { title: '日付', showgrid: true, gridcolor: '#222' },
                yaxis: { title: '騰落率 (%)', showgrid: true, gridcolor: '#222', ticksuffix: '%' },
                font: { color: 'white' },
                template: 'plotly_dark',
                paper_bgcolor: 'black',
                plot_bgcolor: '#111111',
                hovermode: 'x unified',
                showlegend: false,
                annotations: [annotationList, annotationCenter],
                margin: { t: 80, l: 60, r: 40, b: 50 }
            };

            Plotly.newPlot('chart', [trace], layout, {responsive: true});
        }

        window.onload = function() {
            updateChart();
        };
    </script>
</body>
</html>
