name: Buffer投稿連携テスト

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buffer-post:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: X投稿文を生成
        run: python scripts/market_post_generator_v6.py

      - name: Buffer予約投稿キューへ追加
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: python scripts/buffer_post_sender_v3.py
