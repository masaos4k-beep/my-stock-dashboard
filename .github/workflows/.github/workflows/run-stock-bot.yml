name: 毎日朝6時の株価HTML自動生成

on:
  schedule:
    # 💡 毎朝6時（日本時間）に実行するスケジュール設定
    # GitHubの時間は「世界標準時(UTC)」で動くため、9時間引いた「前日の21:00」を指定します。
    - cron: '0 21 * * *'
  workflow_dispatch: # ボタンを押して手動でいつでも即時テスト実行できる機能

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub上のファイル（PythonやHTML）を仮想マシンに読み込む
    - name: コードのチェックアウト
      uses: actions/checkout@v4

    # 2. 仮想マシンにPython環境をセットアップ
    - name: Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. yfinanceなどの必要なライブラリをインストール
    - name: 必要なライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas

    # 4. あなたのPythonスクリプトを実行してHTMLを生成
    - name: Pythonスクリプトの実行
      run: |
        python main.py  # 💡 ご自身のPythonファイル名が「main.py」でない場合は、ここを実際のファイル名に書き換えてください。

    # 5. 生成された新しいHTMLファイルを、GitHubに自動で上書き保存（コミット）する
    - name: 生成されたHTMLをGitHubに保存
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --cached --quiet || git commit -m "毎朝の株価自動更新"
        git push
