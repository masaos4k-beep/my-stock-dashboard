        title: "1ヶ月騰落率 (%)",
        cmin: -52.59044724704168,
        cmax: 52.59044724704168
    },
    {
        title: "年初来騰落率 (%)",
        cmin: -136.50021526870066,
        cmax: 136.50021526870066
    }
];


function changePeriod(index) {

    const visible = [
        false,
        false,
        false,
        false
    ];

    visible[index] = true;

    const settings = periodSettings[index];

    Plotly.update(
        "heatmap-chart",

        {
            visible: visible
        },

        {
            "coloraxis.cmin": settings.cmin,
            "coloraxis.cmax": settings.cmax,
            "coloraxis.colorbar.title.text": settings.title
        }
    );

    document.querySelectorAll(".period-btn").forEach(
        (button, buttonIndex) => {

            button.classList.toggle(
                "active",
                buttonIndex === index
            );
        }
    );
}


document.querySelectorAll(".period-btn").forEach(
    button => {

        button.addEventListener("click", () => {

            changePeriod(
                Number(button.dataset.period)
            );

        });
    }
);


window.addEventListener("resize", () => {

    const chart = document.getElementById(
        "heatmap-chart"
    );

    if (chart) {
        Plotly.Plots.resize(chart);
    }

});

</script>

</body>
</html>
