        cmin: -43.57477001242562,
        cmax: 43.57477001242562
    },
    {
        title: "年初来騰落率 (%)",
        cmin: -137.23095348483102,
        cmax: 137.23095348483102
    }
];


function changePeriod(index) {

    const visible = [
        false,
        false,
        false,
        false
    ];

    visible[index] = true;

    const settings = periodSettings[index];

    Plotly.update(
        "heatmap-chart",

        {
            visible: visible
        },

        {
            "coloraxis.cmin": settings.cmin,
            "coloraxis.cmax": settings.cmax,
            "coloraxis.colorbar.title.text": settings.title
        }
    );

    document.querySelectorAll(".period-btn").forEach(
        (button, buttonIndex) => {

            button.classList.toggle(
                "active",
                buttonIndex === index
            );
        }
    );
}


document.querySelectorAll(".period-btn").forEach(
    button => {

        button.addEventListener("click", () => {

            changePeriod(
                Number(button.dataset.period)
            );

        });
    }
);


window.addEventListener("resize", () => {

    const chart = document.getElementById(
        "heatmap-chart"
    );

    if (chart) {
        Plotly.Plots.resize(chart);
    }

});

</script>

</body>
</html>
