        cmin: -16.156359675662593,
        cmax: 16.156359675662593
    },
    {
        title: "1ヶ月騰落率 (%)",
        cmin: -35.9183664532415,
        cmax: 35.9183664532415
    },
    {
        title: "年初来騰落率 (%)",
        cmin: -172.0185698041163,
        cmax: 172.0185698041163
    }
];


function changePeriod(index) {

    const visible = [
        false,
        false,
        false,
        false
    ];

    visible[index] = true;

    const settings = periodSettings[index];

    Plotly.update(
        "heatmap-chart",

        {
            visible: visible
        },

        {
            "coloraxis.cmin": settings.cmin,
            "coloraxis.cmax": settings.cmax,
            "coloraxis.colorbar.title.text": settings.title
        }
    );

    document.querySelectorAll(".period-btn").forEach(
        (button, buttonIndex) => {

            button.classList.toggle(
                "active",
                buttonIndex === index
            );
        }
    );
}


document.querySelectorAll(".period-btn").forEach(
    button => {

        button.addEventListener("click", () => {

            changePeriod(
                Number(button.dataset.period)
            );

        });
    }
);


window.addEventListener("resize", () => {

    const chart = document.getElementById(
        "heatmap-chart"
    );

    if (chart) {
        Plotly.Plots.resize(chart);
    }

});

</script>
